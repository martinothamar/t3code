apiVersion: agents.platform/v1alpha1
kind: AgentVariant
extends: agent.yaml

# The same Agent, sized to fit beside other nested Agents inside the dev Agent.
metadata:
  name: mini-nested

spec:
  sandbox:
    resources:
      cpu: "2"
      memory: "3Gi"
      rootFilesystem:
        capacity: "16Gi"
        mode: direct
