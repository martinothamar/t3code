apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: mini
spec:
  sandbox:
    image:
      type: build
      context: .
      dockerfile: Dockerfile
    platform:
      os: linux
    resources:
      cpu: "4"
      memory: "8Gi"
      rootFilesystem:
        capacity: "32Gi"
        mode: direct
    initSystem: image
    mounts:
      - type: tmpfs
        target: /tmp
        capacity: "2Gi"
  # Pi's configuration for the aivar gateway, and its instructions.
  home:
    source: home
  instructions:
    - source: home/.pi/agent/AGENTS.md
  # agentctl requires a harness. It serves agentctl Sessions only; T3 Code drives Pi.
  harnesses:
    - type: claudeCode
      auth: mediated
      optional: true
  environment:
    - name: GIT_USER_NAME
    - name: GIT_USER_EMAIL
  secrets:
    - environment: AIVAR_API_KEY
      placeholder: aivar_AGENT_MEDIATED_API_KEY
      allowedHosts:
        - api.aivar.no
    - environment: GITHUB_TOKEN
      placeholder: github_pat_AGENT_MEDIATED_GITHUB_TOKEN
      optional: true
      allowedHosts:
        - github.com
        - api.github.com
        - gist.github.com
        - uploads.github.com
  access:
    - type: ssh
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
