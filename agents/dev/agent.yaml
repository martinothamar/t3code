apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: t3code-dev
spec:
  sandbox:
    image:
      type: reference
      reference: ghcr.io/martinothamar/t3code/t3code-dev:latest
    platform:
      os: linux
    resources:
      cpu: "8"
      memory: "16Gi"
      rootFilesystem:
        capacity: "64Gi"
        mode: direct
      # Nested Agents, for developing the agentctl integration. A host that cannot provide them
      # leaves the Agent without them, as its NestedSandboxes condition says.
      nestedSandboxes: preferred
    initSystem: image
    mounts:
      - type: tmpfs
        target: /tmp
        capacity: "4Gi"
  home:
    source: home
  instructions:
    - source: instructions.md
  skills:
    - source: skills/demo-video
  harnesses:
    - type: claudeCode
      auth: mediated
      default: true
      defaults:
        model: opus
    - type: codex
      auth: mediated
      optional: true
  environment:
    - name: GIT_USER_NAME
    - name: GIT_USER_EMAIL
  secrets:
    - environment: GITHUB_TOKEN
      placeholder: github_pat_AGENT_MEDIATED_GITHUB_TOKEN
      allowedHosts:
        - github.com
        - api.github.com
        - gist.github.com
        - uploads.github.com
  access:
    - type: ssh
    - type: vnc
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
