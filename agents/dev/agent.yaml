apiVersion: agents.platform/v1alpha1
kind: Agent
metadata:
  name: t3code-dev
spec:
  sandbox:
    image:
      type: build
      context: .
      dockerfile: Dockerfile
    platform:
      os: linux
    resources:
      cpu: "8"
      memory: "16Gi"
      rootFilesystem:
        capacity: "64Gi"
        mode: direct
    initSystem: image
    mounts:
      - type: tmpfs
        target: /tmp
        capacity: "4Gi"
  home:
    source: home
  instructions:
    - source: instructions.md
  skills:
    - source: skills/computer-use
    - source: skills/demo-video
  harnesses:
    - type: claudeCode
      auth: mediated
      default: true
      defaults:
        model: opus
    - type: codex
      auth: mediated
      optional: true
  environment:
    - name: GIT_USER_NAME
    - name: GIT_USER_EMAIL
  secrets:
    - environment: GITHUB_TOKEN
      placeholder: github_pat_AGENT_MEDIATED_GITHUB_TOKEN
      allowedHosts:
        - github.com
        - api.github.com
        - gist.github.com
        - uploads.github.com
  access:
    - type: ssh
    - type: vnc
  network:
    mode: mediated
    allow: all
    deny:
      - metadata.google.internal
