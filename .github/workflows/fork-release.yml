# Publishes the fork's desktop apps and the T3 server archives its SSH hosts and Sandboxes install,
# under one version, as a release of this repository. Run it by hand from the Actions tab.
#
# The version is upstream's preview form, `<core>-preview.<date>.<run>`. A desktop build with such a
# version gets no update feed (isDesktopPreviewVersion in scripts/build-desktop-artifact.ts), so
# the apps never replace themselves, and the app installs the server archive of that same version
# from this repository's releases (apps/desktop/src/ssh/remoteServerOverrides.ts).
#
# Packaging is upstream's release-desktop.yml, called once per target as release.yml does: it
# needs only the `js-bundle` artifact built here, and skips signing without the secrets. A run on
# `main` becomes the latest release; a run on any other branch is a prerelease, for testing.
name: Fork release

on:
  workflow_dispatch:
  # TEMPORARY: a dispatch needs the file on main; drop before merging.
  push:
    branches:
      - feat/fork-releases

concurrency:
  group: fork-release
  cancel-in-progress: false

permissions:
  # The Windows build reads this run's artifact list to wait for the Linux archive it embeds.
  actions: read
  contents: read

jobs:
  preflight:
    name: Resolve version
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=@t3tools/scripts...

      - id: meta
        name: Resolve release version
        run: |
          node scripts/resolve-nightly-release.ts \
            --channel preview \
            --date "$(date -u +%Y%m%d)" \
            --run-number "${{ github.run_number }}" \
            --sha "${{ github.sha }}" \
            --github-output

  # The server bundle, web client and Electron main, built once for every target. Without T3
  # Connect's public config, which only upstream's deployment has, the server runs and only T3
  # Connect is unavailable.
  build_bundle:
    name: Build JS bundle
    needs: [preflight]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          sparse-checkout: |
            /*
            !/.repos/
          sparse-checkout-cone-mode: false

      - name: Setup Vite+
        uses: voidzero-dev/setup-vp@v1
        with:
          node-version-file: package.json
          cache: true
          run-install: |
            args:
              - --filter=t3...
              - --filter=@t3tools/web...
              - --filter=@t3tools/desktop...
              - --filter=@t3tools/scripts...

      - name: Align package versions to release version
        run: node scripts/update-release-package-versions.ts "${{ needs.preflight.outputs.version }}"

      # @t3tools/desktop#build compiles the Linux browser secret helper, which needs libsecret.
      - name: Install browser secret helper build libraries
        run: sudo apt-get update && sudo apt-get install -y libsecret-1-dev pkg-config

      - name: Build JS bundle
        run: vp run build:desktop

      - name: Upload JS bundle
        uses: actions/upload-artifact@v7
        with:
          name: js-bundle
          path: |
            apps/server/dist
            apps/desktop/dist-electron
          if-no-files-found: error
          retention-days: 1

  # Server archives come for the hosts the SSH installer supports (packages/ssh/src/tunnel.ts):
  # Linux x64 and arm64, and macOS arm64, each from the job of its own platform. Node cannot build
  # a single executable for an Intel Mac, so that job builds only the app. Windows is no SSH host;
  # its WSL backend embeds the Linux archive of its own arch, which release-desktop.yml waits for
  # by the name of the job that builds it, `Build Linux <arch>`.
  desktop:
    name: Desktop
    needs: [preflight, build_bundle]
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Linux x64
            runner: ubuntu-24.04
            platform: linux
            target: AppImage
            arch: x64
            rust_target: x86_64-unknown-linux-gnu
            resource_key: linux-x64
            cli_archive: true
          - label: Linux arm64
            runner: ubuntu-24.04-arm
            platform: linux
            target: AppImage
            arch: arm64
            rust_target: aarch64-unknown-linux-gnu
            resource_key: linux-arm64
            cli_archive: true
          - label: macOS arm64
            runner: macos-15
            platform: mac
            target: dmg
            arch: arm64
            rust_target: aarch64-apple-darwin
            resource_key: darwin-arm64
            cli_archive: true
          - label: macOS x64
            runner: macos-15
            platform: mac
            target: dmg
            arch: x64
            rust_target: x86_64-apple-darwin
            resource_key: darwin-x64
            cli_archive: false
          - label: Windows x64
            runner: windows-2025
            platform: win
            target: nsis
            arch: x64
            rust_target: x86_64-pc-windows-msvc
            resource_key: win32-x64
            cli_archive: false
          - label: Windows arm64
            runner: windows-11-arm
            platform: win
            target: nsis
            arch: arm64
            rust_target: aarch64-pc-windows-msvc
            resource_key: win32-arm64
            cli_archive: false
    uses: ./.github/workflows/release-desktop.yml
    with:
      version: ${{ needs.preflight.outputs.version }}
      ref: ${{ github.sha }}
      release_channel: preview
      relay_client_tracing: false
      clerk_publishable_key: ""
      clerk_jwt_template: ""
      clerk_cli_oauth_client_id: ""
      relay_url: ""
      label: ${{ matrix.label }}
      runner: ${{ matrix.runner }}
      platform: ${{ matrix.platform }}
      target: ${{ matrix.target }}
      arch: ${{ matrix.arch }}
      rust_target: ${{ matrix.rust_target }}
      resource_key: ${{ matrix.resource_key }}
      cli_archive: ${{ matrix.cli_archive }}

  release:
    name: Publish release
    needs: [preflight, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          filter: tree:0
          sparse-checkout: .github

      - name: Download desktop apps
        uses: actions/download-artifact@v8
        with:
          pattern: desktop-*
          merge-multiple: true
          path: release-assets

      - name: Download server archives
        uses: actions/download-artifact@v8
        with:
          pattern: cli-*
          merge-multiple: true
          path: release-assets

      # The SSH installer and scripts/fork/install-desktop.ts both verify downloads against this.
      - name: Write checksums
        working-directory: release-assets
        run: |
          set -euo pipefail
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.preflight.outputs.tag }}
          VERSION: ${{ needs.preflight.outputs.version }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Only for the notes, so a failed fetch leaves the base unknown rather than the release.
          git fetch --quiet --filter=tree:0 https://github.com/pingdotgg/t3code.git \
            'refs/tags/v*:refs/tags/v*' || true
          upstream="$(git describe --tags --abbrev=0 --match 'v*-nightly.*' "$GITHUB_SHA" 2>/dev/null || echo unknown)"
          {
            echo "Built from \`$GITHUB_SHA\` on \`$REF_NAME\`, based on upstream \`$upstream\`."
            echo
            echo 'Install the desktop app with `node scripts/fork/install-desktop.ts`; see docs/operations/fork-desktop-build.md.'
          } > notes.md
          if [[ "$REF_NAME" == main ]]; then
            channel=(--latest)
          else
            channel=(--prerelease --latest=false)
          fi
          gh release create "$TAG" release-assets/* \
            --target "$GITHUB_SHA" \
            --title "T3 Code fork $VERSION" \
            --notes-file notes.md \
            "${channel[@]}"
